[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teraterm-qa-runner"
version = "1.0.0"
description = "Guided manual test runs in Tera Term that record every result straight into an Excel workbook."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []                      # standard library only, by design
keywords = ["teraterm", "ttl", "qa", "manual-testing", "regression", "excel", "xlsx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
qa-runner = "qa_runner.cli:main"

[project.urls]
Homepage = "https://github.com/TaqdeerK22/teraterm-qa-runner"
Issues = "https://github.com/TaqdeerK22/teraterm-qa-runner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
